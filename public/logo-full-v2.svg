<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="pp-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FF4500"/>
    </linearGradient>
  </defs>

  <!-- Logo mark: Circle with P + keyhole (privacy/security concept) -->
  <g transform="translate(10, 10)">
    <circle cx="50" cy="50" r="48" fill="none" stroke="url(#pp-grad2)" stroke-width="3"/>
    <!-- P shape -->
    <path d="
      M 35 28
      L 35 72
      L 43 72
      L 43 55
      L 57 55
      C 67 55 72 48 72 41
      C 72 34 67 28 57 28
      L 35 28
      Z
      M 43 36
      L 55 36
      C 59 36 61 38 61 41
      C 61 44 59 46 55 46
      L 43 46
      L 43 36
      Z
    " fill="url(#pp-grad2)"/>
    <!-- Keyhole at bottom of P stem (privacy/security) -->
    <circle cx="43" cy="64" r="3" fill="#0A0A0A"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(125, 0)">
    <text x="0" y="52" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF" letter-spacing="-1.5">
      Pawn<tspan fill="#FF6B00">Pass</tspan>
    </text>
    <text x="2" y="74" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#888888" letter-spacing="3">
      DIGITAL PAWNBROKER
    </text>
  </g>
</svg>
